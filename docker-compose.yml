services:
  superpelu:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      OPENWA_ENABLED: ${OPENWA_ENABLED:-false}
      OPENWA_API_URL: ${OPENWA_API_URL:-http://openwa:2785/api}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_SESSION_ID: ${OPENWA_SESSION_ID:-}
      OPENWA_NOTIFY_PUBLIC_ONLY: ${OPENWA_NOTIFY_PUBLIC_ONLY:-false}
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - superpelu
    networks:
      - web

  # OpenWA (producción en la misma red) — dev local preferido:
  #   cd openwa && docker compose -f docker-compose.dev.yml up -d
  #   → http://localhost:2886 · http://localhost:2785/api
  openwa:
    profiles: ['openwa']
    build: ./openwa
    container_name: openwa
    restart: unless-stopped
    expose:
      - '2785'
    environment:
      NODE_ENV: production
      PORT: 2785
      DATABASE_TYPE: sqlite
      DATABASE_NAME: /app/data/openwa.sqlite
      DATABASE_SYNCHRONIZE: 'false'
      ENGINE_TYPE: whatsapp-web.js
      SESSION_DATA_PATH: /app/data/sessions
      PUPPETEER_HEADLESS: 'true'
      PUPPETEER_ARGS: --no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/media
      API_MASTER_KEY: ${OPENWA_API_MASTER_KEY:-}
    volumes:
      - openwa-data:/app/data
    networks:
      - web
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:2785/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Dashboard OpenWA (QR y API key) — solo localhost
  openwa-dashboard:
    profiles: ['openwa']
    build:
      context: ./openwa/dashboard
      dockerfile: Dockerfile
    container_name: openwa-dashboard
    restart: unless-stopped
    ports:
      - '127.0.0.1:2886:80'
    depends_on:
      openwa:
        condition: service_healthy
    networks:
      - web

volumes:
  caddy-data:
  caddy-config:
  openwa-data:

networks:
  web:
    driver: bridge
